services:
  zerotier:
    image: zerotier/zerotier:1.14.2
    container_name: zerotier
    network_mode: host
    cap_add:
      - NET_ADMIN
      - SYS_ADMIN  # required for tun/tap and network namespace management in Docker
    devices:
      - /dev/net/tun:/dev/net/tun
    volumes:
      - zerotier_data:/var/lib/zerotier-one
      - ./local.conf:/var/lib/zerotier-one/local.conf:ro
    environment:
      ZEROTIER_API_SECRET: "${ZEROTIER_API_SECRET}"
      ZEROTIER_IDENTITY_PUBLIC: "${ZEROTIER_IDENTITY_PUBLIC}"
      ZEROTIER_IDENTITY_SECRET: "${ZEROTIER_IDENTITY_SECRET}"
    command: ["${ZT_NETWORK_ID}"]
    healthcheck:
      test: ["CMD-SHELL", "zerotier-cli listnetworks | grep -q OK"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 30s
    restart: unless-stopped

volumes:
  zerotier_data:
