process_names:
  # Netclient daemon - primary target for socket leak detection
  - name: "netclient"
    exe:
      - /sbin/netclient
    cmdline:
      - daemon

  # Netmaker server
  - name: "netmaker"
    comm:
      - netmaker

  # Mosquitto MQTT broker
  - name: "mosquitto"
    comm:
      - mosquitto

  # BIRD BGP routing daemon
  - name: "bird"
    comm:
      - bird
