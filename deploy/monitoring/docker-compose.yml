# 44mesh Monitoring Stack
# Exporters for netclient, netmaker, mosquitto, bird, and mesh health
#
# Requires MONITORING_NETWORK env var pointing to the Docker network
# where VictoriaMetrics runs (so process-exporter can be scraped by name).
# mesh-watchdog uses host network; VM scrapes it via bridge gateway.

services:
  process-exporter:
    image: ncabatoff/process-exporter:0.8.7
    container_name: 44mesh-process-exporter
    pid: host
    volumes:
      - /proc:/host/proc:ro
      - ./process-exporter.yml:/config/config.yml:ro
    command:
      - "--procfs=/host/proc"
      - "--config.path=/config/config.yml"
      - "--web.listen-address=:9256"
    networks:
      - monitoring
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 128M
          cpus: '0.25'
  mesh-watchdog:
    build:
      context: .
      dockerfile: Dockerfile.watchdog
    container_name: 44mesh-mesh-watchdog
    network_mode: host
    cap_add:
      - NET_ADMIN
    volumes:
      - /proc/net/sockstat:/host/proc/net/sockstat:ro
    environment:
      LISTEN_PORT: "${WATCHDOG_PORT}"
      LISTEN_ADDR: "${LISTEN_ADDR}"
      COLLECT_INTERVAL: "${COLLECT_INTERVAL}"
      NETMAKER_API_URL: "${NETMAKER_API_URL}"
      MQTT_HOST: "${MQTT_HOST}"
      MQTT_PORT: "${MQTT_PORT}"
      DNS_TEST_DOMAIN: "${DNS_TEST_DOMAIN}"
      DNS_TEST_INTERNAL: "${DNS_TEST_INTERNAL}"
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 128M
          cpus: '0.25'
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://$${LISTEN_ADDR}:$${LISTEN_PORT}/health"]
      interval: 30s
      timeout: 5s
      retries: 3

networks:
  monitoring:
    external: true
    name: ${MONITORING_NETWORK}
