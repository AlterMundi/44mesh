apiVersion: 1

groups:
  # -- Group 1: netclient process-level alerts --
  - orgId: 1
    name: 44mesh-netclient
    folder: 44mesh
    interval: 10s
    rules:
      # 1 -- Netclient FD Leak Warning --
      - uid: 44mesh-fd-warn
        title: Netclient FD Leak Warning
        condition: C
        for: 2m
        noDataState: Alerting
        execErrState: Alerting
        labels:
          severity: warning
          component: netclient
        annotations:
          summary: >-
            Netclient file descriptors at {{ $values.A }} (threshold 1000)
        data:
          - refId: A
            datasourceUid: ${GRAFANA_DATASOURCE_UID}
            relativeTimeRange:
              from: 300
              to: 0
            model:
              expr: namedprocess_namegroup_open_filedesc{groupname="netclient"}
              instant: true
              refId: A
          - refId: C
            datasourceUid: __expr__
            relativeTimeRange:
              from: 0
              to: 0
            model:
              type: threshold
              expression: A
              refId: C
              conditions:
                - evaluator:
                    type: gt
                    params:
                      - 1000
                  operator:
                    type: and
                  query:
                    params:
                      - A
                  reducer:
                    type: last

      # 2 -- Netclient FD Leak Critical --
      - uid: 44mesh-fd-crit
        title: Netclient FD Leak Critical
        condition: C
        for: 1m
        noDataState: Alerting
        execErrState: Alerting
        labels:
          severity: critical
          component: netclient
        annotations:
          summary: >-
            CRITICAL: Netclient file descriptors at {{ $values.A }} (threshold 5000)
        data:
          - refId: A
            datasourceUid: ${GRAFANA_DATASOURCE_UID}
            relativeTimeRange:
              from: 300
              to: 0
            model:
              expr: namedprocess_namegroup_open_filedesc{groupname="netclient"}
              instant: true
              refId: A
          - refId: C
            datasourceUid: __expr__
            relativeTimeRange:
              from: 0
              to: 0
            model:
              type: threshold
              expression: A
              refId: C
              conditions:
                - evaluator:
                    type: gt
                    params:
                      - 5000
                  operator:
                    type: and
                  query:
                    params:
                      - A
                  reducer:
                    type: last

      # 3 -- Netclient CPU Spike Warning --
      - uid: 44mesh-cpu-warn
        title: Netclient CPU Spike Warning
        condition: C
        for: 2m
        noDataState: Alerting
        execErrState: Alerting
        labels:
          severity: warning
          component: netclient
        annotations:
          summary: >-
            Netclient CPU usage at {{ $values.A }}% (threshold 200%)
        data:
          - refId: A
            datasourceUid: ${GRAFANA_DATASOURCE_UID}
            relativeTimeRange:
              from: 300
              to: 0
            model:
              expr: rate(namedprocess_namegroup_cpu_seconds_total{groupname="netclient"}[2m]) * 100
              instant: true
              refId: A
          - refId: C
            datasourceUid: __expr__
            relativeTimeRange:
              from: 0
              to: 0
            model:
              type: threshold
              expression: A
              refId: C
              conditions:
                - evaluator:
                    type: gt
                    params:
                      - 200
                  operator:
                    type: and
                  query:
                    params:
                      - A
                  reducer:
                    type: last

      # 4 -- Netclient CPU Critical --
      - uid: 44mesh-cpu-crit
        title: Netclient CPU Critical
        condition: C
        for: 1m
        noDataState: Alerting
        execErrState: Alerting
        labels:
          severity: critical
          component: netclient
        annotations:
          summary: >-
            CRITICAL: Netclient CPU usage at {{ $values.A }}% (threshold 500%)
        data:
          - refId: A
            datasourceUid: ${GRAFANA_DATASOURCE_UID}
            relativeTimeRange:
              from: 300
              to: 0
            model:
              expr: rate(namedprocess_namegroup_cpu_seconds_total{groupname="netclient"}[2m]) * 100
              instant: true
              refId: A
          - refId: C
            datasourceUid: __expr__
            relativeTimeRange:
              from: 0
              to: 0
            model:
              type: threshold
              expression: A
              refId: C
              conditions:
                - evaluator:
                    type: gt
                    params:
                      - 500
                  operator:
                    type: and
                  query:
                    params:
                      - A
                  reducer:
                    type: last

  # -- Group 2: infrastructure connectivity alerts --
  - orgId: 1
    name: 44mesh-infrastructure
    folder: 44mesh
    interval: 10s
    rules:
      # 5 -- DNS Resolution Failed --
      - uid: 44mesh-dns-fail
        title: DNS Resolution Failed
        condition: C
        for: 1m
        noDataState: Alerting
        execErrState: Alerting
        labels:
          severity: critical
          component: dns
        annotations:
          summary: >-
            DNS resolution probe failed — min(mesh_dns_up) = {{ $values.A }}
        data:
          - refId: A
            datasourceUid: ${GRAFANA_DATASOURCE_UID}
            relativeTimeRange:
              from: 300
              to: 0
            model:
              expr: min(mesh_dns_up)
              instant: true
              refId: A
          - refId: C
            datasourceUid: __expr__
            relativeTimeRange:
              from: 0
              to: 0
            model:
              type: threshold
              expression: A
              refId: C
              conditions:
                - evaluator:
                    type: lt
                    params:
                      - 1
                  operator:
                    type: and
                  query:
                    params:
                      - A
                  reducer:
                    type: last

      # 6 -- WireGuard Handshake Stale --
      - uid: 44mesh-wg-stale
        title: WireGuard Handshake Stale
        condition: C
        for: 5m
        noDataState: OK
        execErrState: Alerting
        labels:
          severity: warning
          component: wireguard
        annotations:
          summary: >-
            WireGuard peer handshake age {{ $values.A }}s exceeds 300s threshold
        data:
          - refId: A
            datasourceUid: ${GRAFANA_DATASOURCE_UID}
            relativeTimeRange:
              from: 300
              to: 0
            model:
              expr: max(mesh_wg_peer_handshake_seconds_ago > 0)
              instant: true
              refId: A
          - refId: C
            datasourceUid: __expr__
            relativeTimeRange:
              from: 0
              to: 0
            model:
              type: threshold
              expression: A
              refId: C
              conditions:
                - evaluator:
                    type: gt
                    params:
                      - 300
                  operator:
                    type: and
                  query:
                    params:
                      - A
                  reducer:
                    type: last

      # 7 -- Netmaker API Down --
      - uid: 44mesh-api-down
        title: Netmaker API Down
        condition: C
        for: 2m
        noDataState: Alerting
        execErrState: Alerting
        labels:
          severity: critical
          component: netmaker
        annotations:
          summary: >-
            Netmaker API is unreachable — mesh_netmaker_api_up = {{ $values.A }}
        data:
          - refId: A
            datasourceUid: ${GRAFANA_DATASOURCE_UID}
            relativeTimeRange:
              from: 300
              to: 0
            model:
              expr: mesh_netmaker_api_up
              instant: true
              refId: A
          - refId: C
            datasourceUid: __expr__
            relativeTimeRange:
              from: 0
              to: 0
            model:
              type: threshold
              expression: A
              refId: C
              conditions:
                - evaluator:
                    type: lt
                    params:
                      - 1
                  operator:
                    type: and
                  query:
                    params:
                      - A
                  reducer:
                    type: last

      # 8 -- MQTT Broker Disconnected --
      - uid: 44mesh-mqtt-down
        title: MQTT Broker Disconnected
        condition: C
        for: 2m
        noDataState: Alerting
        execErrState: Alerting
        labels:
          severity: critical
          component: mqtt
        annotations:
          summary: >-
            MQTT broker is unreachable — mesh_mqtt_up = {{ $values.A }}
        data:
          - refId: A
            datasourceUid: ${GRAFANA_DATASOURCE_UID}
            relativeTimeRange:
              from: 300
              to: 0
            model:
              expr: mesh_mqtt_up
              instant: true
              refId: A
          - refId: C
            datasourceUid: __expr__
            relativeTimeRange:
              from: 0
              to: 0
            model:
              type: threshold
              expression: A
              refId: C
              conditions:
                - evaluator:
                    type: lt
                    params:
                      - 1
                  operator:
                    type: and
                  query:
                    params:
                      - A
                  reducer:
                    type: last

      # 9 -- UDP Socket Flood --
      - uid: 44mesh-udp-flood
        title: UDP Socket Flood
        condition: C
        for: 1m
        noDataState: OK
        execErrState: Alerting
        labels:
          severity: critical
          component: netclient
        annotations:
          summary: >-
            UDP socket count at {{ $values.A }} (threshold 10000)
        data:
          - refId: A
            datasourceUid: ${GRAFANA_DATASOURCE_UID}
            relativeTimeRange:
              from: 300
              to: 0
            model:
              expr: mesh_udp_sockets_total
              instant: true
              refId: A
          - refId: C
            datasourceUid: __expr__
            relativeTimeRange:
              from: 0
              to: 0
            model:
              type: threshold
              expression: A
              refId: C
              conditions:
                - evaluator:
                    type: gt
                    params:
                      - 10000
                  operator:
                    type: and
                  query:
                    params:
                      - A
                  reducer:
                    type: last
