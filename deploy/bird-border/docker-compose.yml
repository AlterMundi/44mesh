# Border Router Node
# BGP peering with ISP + ZeroTier mesh connectivity
#
# Components:
#   - zerotier: mesh client (joins ZeroTier network)
#   - bird: BGP daemon (peers with RPi ISP at 172.30.0.1)

services:
  zerotier:
    image: zerotier/zerotier:latest
    container_name: zerotier
    cap_add:
      - NET_ADMIN
      - SYS_ADMIN
    network_mode: host
    devices:
      - /dev/net/tun:/dev/net/tun
    volumes:
      - zerotier_data:/var/lib/zerotier-one
    environment:
      ZEROTIER_API_SECRET: "${ZEROTIER_API_SECRET}"
    command: ["${ZT_NETWORK_ID}"]
    healthcheck:
      test: ["CMD-SHELL", "ip link show | grep -q '^zt'"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 30s
    restart: unless-stopped

  bird:
    build: .
    container_name: bird-border
    network_mode: host
    cap_add:
      - NET_ADMIN
    environment:
      # BGP Configuration
      - BORDER_ROUTER_AS=${BORDER_ROUTER_AS:-42000}
      - BORDER_ROUTER_IP=${BORDER_ROUTER_IP:-10.20.30.1}
      - ISP_AS=${ISP_AS:-42001}
      - ISP_IP=${ISP_IP:-10.20.30.254}
      - MESH_ADDRESS_RANGE=${MESH_ADDRESS_RANGE:-138.255.89.0/24}
      - BGP_HOLD_TIME=${BGP_HOLD_TIME:-90}
      - BGP_KEEPALIVE_TIME=${BGP_KEEPALIVE_TIME:-30}
    volumes:
      - ./bird.conf.template:/etc/bird/bird.conf.template:ro
    depends_on:
      zerotier:
        condition: service_healthy
    restart: unless-stopped

volumes:
  zerotier_data:
