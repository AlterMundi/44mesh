services:
  zerotier-ui:
    build:
      context: .
      dockerfile: Dockerfile.ztncui
    container_name: zerotier-ui
    network_mode: host
    environment:
      ZT_ADDR: "127.0.0.1:9993"
      ZTNCUI_HTTP_PORT: "${ZTNCUI_HTTP_PORT:-3180}"
      ZTNCUI_HTTPS_PORT: "${ZTNCUI_HTTPS_PORT:-}"
      ZTNCUI_HTTP_ALL_INTERFACES: "${ZTNCUI_HTTP_ALL_INTERFACES}"
      ZTNCUI_HTTPS_HOST: "${ZTNCUI_HTTPS_HOST}"
      ZTNCUI_PASSWD: "${ZTNCUI_PASSWD}"
    volumes:
      - bird-border_zerotier_data:/var/lib/zerotier-one:ro
      - zerotier_ui_etc:/opt/altermundi/zerotier-ui/src/etc
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://127.0.0.1:${ZTNCUI_HTTP_PORT:-3180}/ || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 30s
    restart: unless-stopped

volumes:
  bird-border_zerotier_data:
    external: true
  zerotier_ui_etc:
