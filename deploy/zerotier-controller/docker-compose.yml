services:
  zerotier-controller:
    build:
      context: .
      dockerfile: Dockerfile.controller
      args:
        ZEROTIER_VERSION: ${ZEROTIER_VERSION:-1.16.0}
    container_name: zerotier-controller
    network_mode: host
    cap_add:
      - NET_ADMIN
      - SYS_ADMIN  # required for tun/tap and network namespace management in Docker
    devices:
      - /dev/net/tun:/dev/net/tun
    volumes:
      - zerotier_data:/var/lib/zerotier-one
    healthcheck:
      test: ["CMD-SHELL", "zerotier-cli info | grep -q ONLINE"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 15s
    restart: unless-stopped

  ztncui:
    build:
      context: .
      dockerfile: Dockerfile.ztncui
    container_name: ztncui
    network_mode: host
    environment:
      ZT_ADDR: "127.0.0.1:9993"
      ZTNCUI_HTTP_PORT: "${ZTNCUI_HTTP_PORT:-3180}"
      ZTNCUI_HTTPS_PORT: "${ZTNCUI_HTTPS_PORT:-3443}"
      ZTNCUI_HTTP_ALL_INTERFACES: "${ZTNCUI_HTTP_ALL_INTERFACES}"
      ZTNCUI_HTTPS_HOST: "${ZTNCUI_HTTPS_HOST}"
      ZTNCUI_PASSWD: "${ZTNCUI_PASSWD}"
    volumes:
      - zerotier_data:/var/lib/zerotier-one:ro
      - ztncui_data:/opt/key-networks/ztncui/etc
    depends_on:
      zerotier-controller:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://127.0.0.1:${ZTNCUI_HTTP_PORT:-3180}/ || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 30s
    restart: unless-stopped

volumes:
  zerotier_data:
  ztncui_data:
