name: Validate PR - Docker Compose Build

on:
  pull_request:
    branches:
      - "main"
    types:
      - opened
      - synchronize
      - reopened

concurrency:
  group: pr-validation-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  validate-zerotier-ui:
    name: Validate ZeroTier UI
    runs-on: ubuntu-latest
    environment: zerotier-action

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Create zerotier-ui .env file
        working-directory: deploy/zerotier-ui
        run: |
          cat > .env << 'ENV'
          ZEROTIER_VERSION=1.16.0
          ZTNCUI_HTTP_PORT=3180
          ZTNCUI_HTTPS_PORT=3443
          ZTNCUI_HTTP_ALL_INTERFACES=true
          ZTNCUI_HTTPS_HOST=
          ZTNCUI_PASSWD=test-password
          ENV

      - name: Validate docker-compose configuration
        working-directory: deploy/zerotier-ui
        run: |
          echo "=== Validating zerotier-ui docker-compose ==="
          docker compose config
          echo ""
          echo "=== Services found ==="
          docker compose config --services
          echo ""
          echo "✓ ZeroTier UI configuration validated successfully"

  validate-bird-border:
    name: Validate Bird-Border
    runs-on: ubuntu-latest
    environment: bird-border-action
    needs: validate-zerotier-ui

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Create bird-border .env file
        working-directory: deploy/bird-border
        run: |
          cat > .env << 'ENV'
          ZT_NETWORK_ID=0123456789abcdef
          ZEROTIER_API_SECRET=
          BORDER_ROUTER_AS=65000
          BORDER_ROUTER_IP=172.30.0.100
          BORDER_ROUTER_INTERFACE=eth0
          ISP_AS=65001
          ISP_IP=172.30.0.1
          BGP_NETWORK_RANGE=172.30.0.0/24
          MESH_ADDRESS_RANGE=44.30.127.0/24
          BGP_HOLD_TIME=90
          BGP_KEEPALIVE_TIME=30
          ENV

      - name: Validate docker-compose configuration
        working-directory: deploy/bird-border
        run: |
          echo "=== Validating bird-border docker-compose ==="
          docker compose config
          echo ""
          echo "=== Services found ==="
          docker compose config --services
          echo ""
          echo "✓ Bird-border configuration validated successfully"

      - name: Build bird-border containers
        working-directory: deploy/bird-border
        run: |
          echo "=== Building bird-border image (--no-cache) ==="
          docker compose build --no-cache
          echo ""
          echo "✓ Build completed successfully"

      - name: Verify built images
        run: |
          echo "=== Docker images created ==="
          docker images --format "table {{.Repository}}\t{{.Tag}}\t{{.Size}}\t{{.CreatedAt}}" | head -10
          echo ""
          echo "✓ Images verified"

  validate-zerotier-client:
    name: Validate ZeroTier Client
    runs-on: ubuntu-latest
    needs: validate-zerotier-ui

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Create zerotier client .env file
        working-directory: deploy/zerotier
        run: |
          cat > .env << 'ENV'
          ZT_NETWORK_ID=0123456789abcdef
          ZEROTIER_API_SECRET=
          ZEROTIER_IDENTITY_PUBLIC=
          ZEROTIER_IDENTITY_SECRET=
          ENV

      - name: Validate docker-compose configuration
        working-directory: deploy/zerotier
        run: |
          echo "=== Validating zerotier docker-compose ==="
          docker compose config
          echo ""
          echo "=== Services found ==="
          docker compose config --services
          echo ""
          echo "✓ ZeroTier client configuration validated successfully"

  summary:
    name: Validation Summary
    runs-on: ubuntu-latest
    needs: [validate-zerotier-ui, validate-bird-border, validate-zerotier-client]
    if: always()

    steps:
      - name: Write job summary
        run: |
          {
            echo "## PR Validation Summary"
            echo ""
            echo "### Validation Results"
            echo "| Component | Status |"
            echo "|-----------|--------|"
            echo "| ZeroTier UI | ${{ needs.validate-zerotier-ui.result == 'success' && '✅ Passed' || '❌ Failed' }} |"
            echo "| Bird-Border | ${{ needs.validate-bird-border.result == 'success' && '✅ Passed' || '❌ Failed' }} |"
            echo "| ZeroTier Client | ${{ needs.validate-zerotier-client.result == 'success' && '✅ Passed' || '❌ Failed' }} |"
            echo ""
            echo "### Details"
            echo "- PR: #${{ github.event.pull_request.number }}"
            echo "- Branch: ${{ github.head_ref }}"
            echo "- SHA: ${{ github.event.pull_request.head.sha }}"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Check overall status
        if: needs.validate-zerotier-ui.result != 'success' || needs.validate-bird-border.result != 'success' || needs.validate-zerotier-client.result != 'success'
        run: |
          echo "One or more validations failed"
          exit 1
