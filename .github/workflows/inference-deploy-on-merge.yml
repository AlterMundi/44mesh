name: Deploy bird-border and zerotier on merge to main

on:
  push:
    branches:
      - "main"
  workflow_dispatch:

concurrency:
  group: bird-border-deploy
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  deploy:
    runs-on: self-hosted

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Verify checkout
        run: |
          echo "Current directory: $(pwd)"
          echo "Git branch: $(git branch --show-current)"
          echo "Git SHA: $(git rev-parse HEAD)"
          echo "Expected SHA: ${{ github.sha }}"

      - name: Deploy bird-border (zerotier + bird)
        working-directory: deploy/bird-border
        run: |
          # zerotier service is image-based (not built here), so pull to avoid stale local "latest".
          docker compose --env-file /home/github-runner/configs/44mesh/.env.bird-border pull zerotier
          docker compose --env-file /home/github-runner/configs/44mesh/.env.bird-border up -d --build

      - name: Wait for zerotier healthy and bird running
        shell: bash
        run: |
          timeout=300
          interval=5
          elapsed=0

          while [ $elapsed -lt $timeout ]; do
            zerotier_health="$(docker inspect -f '{{.State.Health.Status}}' zerotier 2>/dev/null || true)"
            bird_state="$(docker inspect -f '{{.State.Status}}' bird-border 2>/dev/null || true)"

            if [ "$zerotier_health" = "healthy" ] && [ "$bird_state" = "running" ]; then
              echo "zerotier is healthy and bird-border is running."
              exit 0
            fi

            echo "Waiting... zerotier=$zerotier_health bird=$bird_state"
            sleep "$interval"
            elapsed=$((elapsed + interval))
          done

          echo "Timeout waiting for running containers."
          docker ps -a
          docker logs zerotier 2>&1 | tail -20
          exit 1

      - name: Deploy zerotier-ui (web UI)
        working-directory: deploy/zerotier-ui
        run: docker compose --env-file /home/github-runner/configs/44mesh/.env.zerotier-ui up -d --build --force-recreate

      - name: Wait for zerotier-ui healthy
        shell: bash
        run: |
          timeout=120
          interval=5
          elapsed=0

          while [ $elapsed -lt $timeout ]; do
            health="$(docker inspect -f '{{.State.Health.Status}}' zerotier-ui 2>/dev/null || true)"
            if [ "$health" = "healthy" ]; then
              echo "zerotier-ui is healthy."
              # Verify critical env vars were applied
              all_ifaces="$(docker inspect -f '{{range .Config.Env}}{{println .}}{{end}}' zerotier-ui | grep ZTNCUI_HTTP_ALL_INTERFACES)"
              echo "Container env: $all_ifaces"
              if echo "$all_ifaces" | grep -q "=true"; then
                echo "HTTP_ALL_INTERFACES correctly set."
                exit 0
              else
                echo "ERROR: ZTNCUI_HTTP_ALL_INTERFACES not set to 'true' — env file may not have been applied."
                docker logs zerotier-ui 2>&1 | tail -10
                exit 1
              fi
            fi

            echo "Waiting... zerotier-ui=$health (${elapsed}s/${timeout}s)"
            sleep "$interval"
            elapsed=$((elapsed + interval))
          done

          echo "Timeout waiting for zerotier-ui healthy."
          docker logs zerotier-ui 2>&1 | tail -20
          exit 1

      - name: Show bird status
        run: docker exec bird-border birdc show status

      - name: Write job summary
        run: |
          {
            echo "## Deployment Summary"
            echo ""
            echo "### Deployments"
            echo "- ✅ Bird-border (zerotier controller + bird)"
            echo "- ✅ zerotier-ui (ZeroTier web UI)"
            echo ""
            echo "### Details"
            echo "- Event: ${{ github.event_name }}"
            echo "- Ref: ${{ github.ref }}"
            echo "- SHA: ${{ github.sha }}"
            echo "- Commit: ${{ github.event.head_commit.message }}"
          } >> "$GITHUB_STEP_SUMMARY"
